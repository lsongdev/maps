<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8faf9">
  <title>Maps · 探索与导航</title>
  <link rel="icon" type="image/png" href="https://lsong.org/icon.png">
  <link rel="icon" type="image/svg+xml" href="https://lsong.org/icon.svg">
  <link rel="apple-touch-icon" type="image/png" href="https://lsong.org/icon.png">
  <link rel="stylesheet" href="index.css?v3">
  <script type="module" src="maps.js?v2"></script>
  <script type="module" src="index.js?v2"></script>
</head>
<body>
  <main class="app-shell">
    <x-leaflet aria-label="地图"></x-leaflet>

    <section class="search-card glass" aria-label="搜索与路线规划">
      <div class="brand-row">
        <div></div>
        <!-- <img class="brand-mark" aria-hidden="true" src="https://lsong.org/assets/web/icon.png?v=3" /> -->
        <div><strong>Maps</strong><span>去你想去的地方</span></div>
        <button class="icon-button route-toggle" type="button" aria-label="规划路线" title="规划路线">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v12a4 4 0 0 0 4 4h8M15 16l3 3-3 3M9 6 6 3 3 6"/></svg>
        </button>
      </div>
      <form class="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="place-search" type="search" placeholder="搜索地点、地址或地标" autocomplete="off" aria-label="搜索地点">
        <button class="clear-search" type="button" aria-label="清除搜索">×</button>
      </form>
      <div class="search-results" role="listbox" hidden></div>
      <div class="route-planner" hidden>
        <div class="route-fields">
          <div class="route-line" aria-hidden="true"><i></i><span></span><b></b></div>
          <div class="route-inputs">
            <div class="input-row"><input id="route-start" type="text" placeholder="我的位置" autocomplete="off" aria-label="路线起点"><button class="use-location" type="button" aria-label="使用当前位置" title="使用当前位置">⌖</button></div>
            <input id="route-end" type="text" placeholder="输入目的地" autocomplete="off" aria-label="路线终点">
          </div>
          <button class="swap-route" type="button" aria-label="交换起点和终点" title="交换起点和终点">⇅</button>
        </div>
        <div class="travel-modes" role="group" aria-label="出行方式">
          <button type="button" data-mode="driving" class="active">驾车</button><button type="button" data-mode="walking">步行</button><button type="button" data-mode="cycling">骑行</button>
        </div>
        <button class="plan-route primary-button" type="button">开始规划</button>
      </div>
    </section>

    <aside class="map-tools" aria-label="地图工具">
      <button class="tool-button layers-button glass" type="button" aria-label="切换图层" title="切换图层"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg></button>
      <div class="layer-menu glass" hidden><span>地图样式</span><button type="button" data-layer="streets" class="active"><i class="streets"></i>街道</button><button type="button" data-layer="light"><i class="light"></i>浅色</button><button type="button" data-layer="satellite"><i class="satellite"></i>卫星</button></div>
      <button class="tool-button locate-button glass" type="button" aria-label="定位到当前位置" title="定位到当前位置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M22 12h-2M12 22v-2M2 12h2"/></svg></button>
    </aside>

    <section class="route-summary glass" hidden aria-live="polite">
      <div class="route-overview">
        <div><strong class="route-duration">--</strong><span class="route-distance">--</span></div>
        <div class="route-actions"><button class="start-navigation primary-button" type="button">开始导航</button><button class="close-route icon-button" type="button" aria-label="关闭路线">×</button></div>
      </div>
      <div class="navigation-now" hidden><div class="maneuver-icon">↑</div><div><strong>准备出发</strong><span>正在获取当前位置…</span></div><button class="stop-navigation" type="button">结束</button></div>
      <ol class="route-steps"></ol>
    </section>
    <div class="toast" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
